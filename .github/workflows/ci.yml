name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The version comes from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo downloads and builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build osflux.exe
        run: cargo build --release --locked -p osflux-cli

      - name: Keep osflux.exe for testing
        uses: actions/upload-artifact@v6
        with:
          name: osflux-windows-x64-${{ github.sha }}
          path: target/release/osflux.exe
          retention-days: 14

  linux:
    name: Linux, and the Windows build from Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # mtools, dosfstools, wimtools and libxml2-utils let the tests check
      # OSflux's FAT32 volumes, WIM splits and answer files with independent
      # tools. The Windows check embeds the icon with mingw-w64's windres,
      # which runs mingw-w64's gcc to preprocess the resource script.
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtools dosfstools wimtools libxml2-utils gcc-mingw-w64-x86-64

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu

      - name: Cache Cargo downloads and builds
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: linux-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check the Windows build
        run: cargo check --workspace --all-targets --locked --target x86_64-pc-windows-gnu

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: 0.20.2
      # The SHA-256 published with that release's x86_64-unknown-linux-musl
      # archive. Update both together.
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install

      - name: Install cargo-deny
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      # Fails when any crate in the build has a licence outside the
      # GPL-3.0-compatible allow-list in deny.toml.
      - name: Check dependency licences
        run: cargo deny --locked check licenses
