name: Release

# Pushing a tag such as v0.2.0 builds, signs (once a certificate is set up),
# packages and publishes a GitHub release. Running it by hand from the
# Actions tab does the same without publishing, and keeps the package as a
# workflow artifact. DOCUMENTS/RELEASING.md describes both.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, sign and package for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    # Signing secrets and the SIGNING_PROVIDER variable live in this
    # environment, which can also require an approval before each release.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Check the signing settings
        shell: pwsh
        env:
          SIGNING_PROVIDER: ${{ vars.SIGNING_PROVIDER }}
        run: |
          if ($env:SIGNING_PROVIDER -and $env:SIGNING_PROVIDER -notin @('ssl-com', 'azure-key-vault')) {
            Write-Error "SIGNING_PROVIDER is '$($env:SIGNING_PROVIDER)'; use ssl-com or azure-key-vault, or remove it to build unsigned."
            exit 1
          }
          if ($env:SIGNING_PROVIDER) { "Signing with $($env:SIGNING_PROVIDER)." } else { "No SIGNING_PROVIDER set: this build will not be code-signed." }

      - name: Install Rust
        run: rustup toolchain install

      - name: Read the version
        id: version
        shell: pwsh
        run: ./scripts/release/read-version.ps1

      - name: Test
        run: cargo test --workspace --locked

      - name: Build osflux.exe
        run: cargo build --release --locked -p osflux-cli

      - name: Sign with SSL.com eSigner
        if: vars.SIGNING_PROVIDER == 'ssl-com'
        uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/target/release/osflux.exe
          output_path: ${{ github.workspace }}/signed
          environment_name: PROD
          malware_block: false
          override: false
          clean_logs: true

      - name: Use the signed osflux.exe
        if: vars.SIGNING_PROVIDER == 'ssl-com'
        shell: pwsh
        run: Move-Item -Force signed/osflux.exe target/release/osflux.exe

      - name: Sign with a certificate in Azure Key Vault
        if: vars.SIGNING_PROVIDER == 'azure-key-vault'
        shell: pwsh
        env:
          KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          KEY_VAULT_CERTIFICATE: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE }}
          KEY_VAULT_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          KEY_VAULT_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          dotnet tool install --global AzureSignTool --version 7.0.1
          azuresigntool sign `
            -kvu $env:KEY_VAULT_URL -kvc $env:KEY_VAULT_CERTIFICATE `
            -kvi $env:KEY_VAULT_CLIENT_ID -kvs $env:KEY_VAULT_CLIENT_SECRET -kvt $env:KEY_VAULT_TENANT_ID `
            -tr $env:TIMESTAMP_URL -td sha256 -fd sha256 -v target/release/osflux.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the signature
        if: vars.SIGNING_PROVIDER != ''
        shell: pwsh
        run: ./scripts/release/verify-signature.ps1 -Path target/release/osflux.exe

      - name: Package
        shell: pwsh
        env:
          SIGNED: ${{ vars.SIGNING_PROVIDER != '' }}
        run: ./scripts/release/package.ps1 -Version '${{ steps.version.outputs.version }}' -Signed:([bool]::Parse($env:SIGNED))

      - name: Keep the package
        uses: actions/upload-artifact@v6
        with:
          name: osflux-${{ steps.version.outputs.version }}-windows-x64
          path: dist/
          retention-days: 30

  publish:
    name: Publish the GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@v7
        with:
          name: osflux-${{ needs.build.outputs.version }}-windows-x64
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/osflux-"$VERSION"-windows-x64.zip dist/SHA256SUMS.txt \
            --title "OSflux $VERSION" --notes-file dist/release-notes.md \
            --verify-tag "${prerelease[@]}"
