[workspace]
members = [
    "crates/osflux-core",
    "crates/osflux-engine",
    "crates/osflux-cli",
    "crates/osflux-studio",
]
default-members = ["crates/osflux-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Joly Doh"]

[workspace.dependencies]
crossbeam = "0.8"
sha2 = "0.10"
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_Security",
] }

# No debug symbols in release executables. (On Windows the linker already
# keeps debug information in a separate .pdb, which is not shipped.)
[profile.release]
strip = "symbols"

# What the Release workflow builds: whole-program link-time optimisation in
# one codegen unit makes the programs about 5% smaller, but takes about
# 20 minutes, so ordinary CI builds keep the release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
