[workspace]
members = [
    "crates/osflux-core",
    "crates/osflux-engine",
    "crates/osflux-cli",
]
default-members = ["crates/osflux-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
crossbeam = "0.8"
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
] }
