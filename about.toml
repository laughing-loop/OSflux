# cargo-about configuration: https://embarkstudios.github.io/cargo-about/
#
# The release workflow runs `cargo about generate` to write
# THIRD-PARTY-NOTICES.html, with the licence of every crate built into
# osflux.exe and osflux-studio.exe, and puts it in the release zip. Run it
# locally with:
#
#   cargo about generate --workspace --all-features --locked \
#     scripts/release/third-party-notices.hbs -o THIRD-PARTY-NOTICES.html

# The same GPL-3.0-compatible licences deny.toml allows.
accepted = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# The programs are built for Windows; only crates in that build are listed.
targets = ["x86_64-pc-windows-msvc"]
# Build scripts and tests are not shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true
