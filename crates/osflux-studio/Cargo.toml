[package]
name = "osflux-studio"
description = "OSflux Studio: the desktop app for writing bootable USB drives"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "osflux_studio"
path = "src/lib.rs"

[[bin]]
name = "osflux-studio"
path = "src/main.rs"

[dependencies]
osflux-engine = { path = "../osflux-engine" }
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "raw-window-handle-06",
] }

# Saves preview snapshots as PNG; already in Slint's dependency tree.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
# The Open dialog, dropped files and the local time.
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The window's Win32 handle, through Slint's raw-window-handle-06 feature.
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
# The local time for the status bar.
libc = "0.2"

[features]
# `--preview`: shows a screen with sample data and can save it as a PNG, for
# screenshots and design checks. Never in release builds.
preview = ["dep:image"]

[dev-dependencies]
# Runs the UI without a window, for the tests in tests/. Must match Slint's version exactly.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = "~1.18.1"
# Embeds the Windows icon, version details and Administrator manifest. The toml feature,
# which reads settings from Cargo.toml, is not needed.
winresource = { version = "0.1.34", default-features = false }
